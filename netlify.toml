[build]
  publish = "."
  command = "echo 'Turbo Game - static site, no build needed'"

[[redirects]]
  from = "/solo"
  to = "/solo.html"
  status = 301

[[redirects]]
  from = "/3d"
  to = "/3d/index.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"