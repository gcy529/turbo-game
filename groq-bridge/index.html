<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groq Key 获取跳板</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;line-height:1.6;color:#222}
h1{font-size:22px}ol{padding-left:20px}
a.btn{display:inline-block;background:#111;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;margin-top:12px}
.note{background:#f5f5f5;padding:12px;border-radius:8px;margin-top:20px;font-size:14px;color:#555}
</style>
</head>
<body>
<h1>🚀 拿 Groq Key（30 秒版）</h1>
<ol>
  <li>点下方按钮去登录 Groq（用你的 GitHub 账号一键登录）</li>
  <li>登录后左边菜单点 <b>API Keys</b></li>
  <li>复制那个 <code>groq_</code> 开头的 key，回来发给我</li>
</ol>
<a class="btn" href="https://console.groq.com/signin" target="_blank">打开 Groq 登录页 ↗</a>
<p class="note">💡 这个网页跑在瑶瑶的机器上（新加坡出口），网络直连 Groq 全通，<b>不需要代理</b>。如果打开还报 Forbidden，说明是你手机本身的出口 IP 被 Groq 拦了，换个网络试试。</p>
</body>
</html>
