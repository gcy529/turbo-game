<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1230" />
<title>逆反 3D · 敬请期待</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#14243c,#04060e);font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#eaf2ff;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .car{font-size:82px;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 28px rgba(90,180,255,.5))}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
  h1{font-size:38px;font-weight:900;letter-spacing:6px;margin:14px 0 6px;background:linear-gradient(180deg,#fff,#67c6ff 70%,#2f7fd0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:12px;letter-spacing:5px;color:#5f86ad;font-weight:700;margin-bottom:26px}
  .badge{display:inline-block;padding:7px 20px;border-radius:999px;background:rgba(255,180,60,.16);border:1.5px solid rgba(255,190,80,.6);color:#ffc078;font-size:13px;font-weight:900;letter-spacing:3px;animation:blink 1.4s ease-in-out infinite;margin-bottom:22px}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
  .desc{max-width:340px;font-size:13px;line-height:2;color:#9dbdd8;margin-bottom:30px}
  .feat{display:flex;flex-direction:column;gap:9px;margin-bottom:32px;font-size:12.5px;color:#a9c6e2;text-align:left}
  .feat div{display:flex;align-items:center;gap:9px}
  .feat i{font-style:normal;font-size:16px}
  .btn{display:inline-block;padding:13px 36px;border-radius:13px;background:linear-gradient(180deg,#8ef7c8,#38d99a);color:#06121e;font-size:14.5px;font-weight:900;letter-spacing:2px;text-decoration:none;box-shadow:0 10px 30px rgba(60,220,160,.35);cursor:pointer;border:0}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(60,220,160,.5)}
  .repo{margin-top:26px;font-size:11.5px;color:#5f86ad;letter-spacing:.5px}
  .repo a{color:#67c6ff;text-decoration:none}
  .repo a:hover{text-decoration:underline}
  .progress{width:220px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:28px}
  .progress i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#38d99a,#67c6ff);border-radius:3px;animation:prog 2.4s ease-in-out infinite}
  @keyframes prog{0%,100%{width:62%}50%{width:78%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="car">🏎️</div>
  <h1>逆反 3D</h1>
  <div class="sub">T U R B O &nbsp; 3 D</div>
  <div class="badge">敬 请 期 待</div>
  <div class="progress"><i></i></div>
  <div class="desc">真 3D 引擎正在开发中<br>目标：和 2D 版一样自动前进 · 更好手感</div>
  <div class="feat">
    <div><i>🚀</i> 自动加速（和 2D 一样松手就跑）</div>
    <div><i>🔄</i> 左右转向修正（不再反向）</div>
    <div><i>🎥</i> 三种相机视角</div>
    <div><i>🌦️</i> 动态天气与光影</div>
  </div>
  <a class="btn" href="index.html">← 先玩 2D 版</a>
  <div class="repo">GitHub：<a href="https://github.com/gcy529/turbo-game" target="_blank">github.com/gcy529/turbo-game</a></div>
</div>
</body>
</html>
