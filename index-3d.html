<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1230" />
<title>TURBO 3D · 极速狂飙</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070e;font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#eaf2ff;user-select:none;-webkit-tap-highlight-color:transparent}
  #game{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:14px;top:12px;z-index:10;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:13px;background:rgba(6,12,22,.6);border:1px solid rgba(120,190,255,.25);backdrop-filter:blur(8px)}
  #spd{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .u{font-size:10px;color:#7fb6e8;font-weight:700;letter-spacing:1px}
  #meta{font-size:11.5px;color:#9dbdd8;line-height:1.5;font-variant-numeric:tabular-nums}
  #meta b{color:#fff}
  #msg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:60px;font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 0 40px rgba(120,200,255,.9);opacity:0;transition:opacity .25s;pointer-events:none;z-index:12;white-space:nowrap}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(18,36,72,.92),rgba(4,6,14,.98));z-index:20;transition:opacity .35s;padding:20px}
  #overlay.hide{opacity:0;pointer-events:none}
  .panel{text-align:center;padding:30px 40px;border-radius:22px;background:rgba(10,18,34,.85);border:1px solid rgba(120,190,255,.25);box-shadow:0 24px 90px rgba(0,0,0,.7);backdrop-filter:blur(16px);max-width:92vw}
  .title{font-size:40px;font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,#fff,#67c6ff 70%,#2f7fd0);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
  .sub{font-size:11px;letter-spacing:5px;color:#5f86ad;margin-bottom:22px;font-weight:700}
  .tag3d{display:inline-block;font-size:10px;font-weight:900;letter-spacing:2px;padding:3px 10px;border-radius:7px;background:rgba(255,180,60,.2);border:1px solid rgba(255,190,80,.6);color:#ffc078;margin-bottom:14px}
  .go{font-size:15px;font-weight:800;letter-spacing:2px;color:#06121e;background:linear-gradient(180deg,#8ef7c8,#38d99a);padding:14px 44px;border-radius:13px;display:inline-block;box-shadow:0 10px 30px rgba(60,220,160,.35);cursor:pointer;border:0}
  .keys{display:grid;grid-template-columns:auto auto;gap:8px 20px;font-size:13px;color:#a9c6e2;text-align:left;margin:0 auto 22px;width:max-content}
  .keys b{color:#fff;font-weight:700;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:2px 8px;font-size:12px;display:inline-block;min-width:28px;text-align:center}
  .tip{margin-top:14px;font-size:11px;color:#4e6b88;letter-spacing:1px}
  #touch{position:fixed;inset:0;z-index:11;pointer-events:none;display:none}
  .tb{width:80px;height:80px;border-radius:50%;background:rgba(140,200,255,.2);border:2.5px solid rgba(140,200,255,.5);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#e8f4ff;pointer-events:auto;backdrop-filter:blur(6px);touch-action:none;flex-shrink:0}
  .tb:active{background:rgba(140,200,255,.38)}
  @media (hover:none) and (pointer:coarse){#touch{display:block}}
  .pbox{position:fixed;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <span id="spd">0</span><span class="u">KM/H</span>
  <span id="meta">圈 <b id="lap">1</b>/2<br>本圈 <b id="t1">0.00</b></span>
</div>
<div id="msg"></div>
<div id="touch">
  <div style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:22px;pointer-events:auto">
    <div class="tb" id="tl">◀</div>
    <div class="tb" id="tg">▲</div>
    <div class="tb" id="tr">▶</div>
  </div>
</div>
<div id="overlay">
  <div class="panel">
    <div class="tag3d">TRUE 3D · WebGL</div>
    <div class="title">TURBO 3D</div>
    <div class="sub">极 速 狂 飙</div>
    <div class="keys">
      <span><b>W</b> <b>↑</b> 加速</span><span><b>S</b> <b>↓</b> 刹车/倒退</span>
      <span><b>A</b> <b>←</b> 左转</span><span><b>D</b> <b>→</b> 右转</span>
      <span><b>C</b> 切换视角</span><span><b>R</b> 重开</span>
    </div>
    <button class="go" id="startBtn">开始比赛</button>
    <div class="tip">真 3D 赛道 · 跟随相机 · 动态光影 · NPC 车流</div>
    <div class="tip" style="margin-top:8px"><a href="index.html" style="color:#67c6ff">← 回到 2D 版本</a></div>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ================= 基础 ================= */
  var canvas = document.getElementById('game');
  var W = window.innerWidth, H = window.innerHeight;

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1230);
  scene.fog = new THREE.Fog(0x1a2444, 90, 340);

  var camera = new THREE.PerspectiveCamera(72, W / H, 0.5, 900);

  /* ================= 光照 ================= */
  var hemi = new THREE.HemisphereLight(0x99bbff, 0x223311, 0.75);
  scene.add(hemi);

  var sun = new THREE.DirectionalLight(0xffddaa, 1.15);
  sun.position.set(90, 140, 60);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 10;
  sun.shadow.camera.far = 500;
  sun.shadow.camera.left = -120;
  sun.shadow.camera.right = 120;
  sun.shadow.camera.top = 120;
  sun.shadow.camera.bottom = -120;
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x404060, 0.5));

  /* ================= 赛道曲线 ================= */
  var SEG_COUNT = 420;      // 采样段
  var ROAD_W = 16;          // 路面宽
  var curve;

  function buildTrackCurve() {
    var pts = [];
    var R = 200;             // 基础半径
    var n = 12;              // 控制点
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2;
      // 半径随机起伏 → 形成不同弯道
      var r = R + Math.sin(i * 1.7) * 55 + Math.cos(i * 2.3) * 38;
      var y = Math.sin(i * 0.9) * 14 + Math.cos(i * 1.4) * 9;
      pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
    }
    curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
    return curve;
  }
  buildTrackCurve();

  /* ================= 路面（沿曲线生成三角带） ================= */
  var trackLen = 0;
  function buildRoadMesh() {
    var positions = [];
    var uvs = [];
    var indices = [];
    var railPos = [];      // 护栏顶点
    var railIdx = [];
    var prevP = null, prevN = null;

    for (var i = 0; i <= SEG_COUNT; i++) {
      var t = i / SEG_COUNT;
      var p = curve.getPointAt(t % 1);
      var tan = curve.getTangentAt(t % 1).normalize();
      // 侧向量 = 上 × 切线
      var side = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tan).normalize();

      var L = p.clone().addScaledVector(side, -ROAD_W / 2);
      var R2 = p.clone().addScaledVector(side, ROAD_W / 2);

      positions.push(L.x, L.y, L.z);
      positions.push(R2.x, R2.y, R2.z);
      uvs.push(0, t * 40);
      uvs.push(1, t * 40);

      // 护栏（左右各一根柱）
      for (var s = -1; s <= 1; s += 2) {
        var base = p.clone().addScaledVector(side, s * (ROAD_W / 2 + 0.6));
        railPos.push(base.x, base.y, base.z);
        railPos.push(base.x, base.y + 1.5, base.z);
      }

      if (i > 0) {
        var a = (i - 1) * 2, b = a + 1, c = i * 2, d = c + 1;
        indices.push(a, b, c, b, d, c);
      }
    }
    // 护栏面片
    for (var k = 0; k < SEG_COUNT; k++) {
      var r0 = k * 4, r1 = (k + 1) * 4;
      railIdx.push(r0 + 0, r0 + 1, r1 + 0, r0 + 1, r1 + 1, r1 + 0);       // 左
      railIdx.push(r0 + 2, r0 + 3, r1 + 2, r0 + 3, r1 + 3, r1 + 2);       // 右
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    var mat = new THREE.MeshStandardMaterial({ color: 0x4a4a55, roughness: 0.85, metalness: 0.05 });
    var road = new THREE.Mesh(geo, mat);
    road.receiveShadow = true;
    scene.add(road);

    // 中线（虚线）
    var centerPos = [], centerIdx = [];
    for (var m = 0; m <= SEG_COUNT; m++) {
      var tm = m / SEG_COUNT;
      var pm = curve.getPointAt(tm % 1);
      var tm2 = curve.getTangentAt(tm % 1).normalize();
      var sm = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tm2).normalize();
      var w = 0.22;
      centerPos.push(pm.x - sm.x * w, pm.y + 0.02, pm.z - sm.z * w);
      centerPos.push(pm.x + sm.x * w, pm.y + 0.02, pm.z + sm.z * w);
      if (m > 0) { var ca = (m - 1) * 2; centerIdx.push(ca, ca + 1, ca + 2, ca + 1, ca + 3, ca + 2); }
    }
    var cGeo = new THREE.BufferGeometry();
    cGeo.setAttribute('position', new THREE.Float32BufferAttribute(centerPos, 3));
    cGeo.setIndex(centerIdx);
    cGeo.computeVertexNormals();
    scene.add(new THREE.Mesh(cGeo, new THREE.MeshBasicMaterial({ color: 0xdfe7f2 })));

    // 护栏网格
    var rGeo = new THREE.BufferGeometry();
    rGeo.setAttribute('position', new THREE.Float32BufferAttribute(railPos, 3));
    rGeo.setIndex(railIdx);
    rGeo.computeVertexNormals();
    scene.add(new THREE.Mesh(rGeo, new THREE.MeshStandardMaterial({
      color: 0xd0d8e4, roughness: 0.6, metalness: 0.35, side: THREE.DoubleSide
    })));

    trackLen = curve.getLength();
  }
  buildRoadMesh();

  /* ================= 场景装饰（树/柱） ================= */
  function addScenery() {
    var treeGeo = new THREE.ConeGeometry(2.2, 7, 6);
    var trunkGeo = new THREE.CylinderGeometry(0.35, 0.45, 2, 5);
    var treeMat = new THREE.MeshStandardMaterial({ color: 0x1a6b46, roughness: 0.9 });
    var trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2b1e, roughness: 1 });
    var count = 150;
    for (var i = 0; i < count; i++) {
      var t = i / count;
      var p = curve.getPointAt(t);
      var tan = curve.getTangentAt(t).normalize();
      var side = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tan).normalize();
      var sideSign = (i % 2 === 0) ? 1 : -1;
      var dist = ROAD_W / 2 + 4 + Math.random() * 18;
      var pos = p.clone().addScaledVector(side, sideSign * dist);
      var g = new THREE.Group();
      var trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 1; trunk.castShadow = true;
      var top = new THREE.Mesh(treeGeo, treeMat);
      top.position.y = 5; top.castShadow = true;
      g.add(trunk); g.add(top);
      g.position.copy(pos);
      g.scale.setScalar(0.7 + Math.random() * 0.8);
      scene.add(g);
    }
    // 路边灯柱
    var poleGeo = new THREE.CylinderGeometry(0.16, 0.16, 7, 6);
    var poleMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.7 });
    for (var j = 0; j < 60; j++) {
      var tj = j / 60;
      var pj = curve.getPointAt(tj);
      var tanj = curve.getTangentAt(tj).normalize();
      var sidej = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tanj).normalize();
      var pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.copy(pj.clone().addScaledVector(sidej, (j % 2 ? 1 : -1) * (ROAD_W / 2 + 2.5)));
      pole.position.y += 3.5;
      pole.castShadow = true;
      scene.add(pole);
    }
  }
  addScenery();

  /* ================= 车辆 ================= */
  function makeCar(color) {
    var g = new THREE.Group();
    var bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.35, metalness: 0.5 });
    var darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1d26, roughness: 0.6 });
    var glassMat = new THREE.MeshStandardMaterial({ color: 0x9fd0ff, roughness: 0.15, metalness: 0.8, transparent: true, opacity: 0.75 });
    var lightMat = new THREE.MeshStandardMaterial({ color: 0xff3344, emissive: 0xff2233, emissiveIntensity: 0.9 });

    var body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.62, 4.2), bodyMat);
    body.position.y = 0.62; body.castShadow = true;
    g.add(body);

    var cabin = new THREE.Mesh(new THREE.BoxGeometry(1.66, 0.52, 2.0), glassMat);
    cabin.position.set(0, 1.14, -0.15); cabin.castShadow = true;
    g.add(cabin);

    var roof = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.14, 2.1), bodyMat);
    roof.position.set(0, 1.4, -0.15);
    g.add(roof);

    // 前灯
    var hlMat = new THREE.MeshStandardMaterial({ color: 0xfff6dd, emissive: 0xfff0c0, emissiveIntensity: 1.2 });
    for (var s = -1; s <= 1; s += 2) {
      var hl = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.2, 0.12), hlMat);
      hl.position.set(s * 0.62, 0.66, 2.12);
      g.add(hl);
      var tl = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.18, 0.1), lightMat);
      tl.position.set(s * 0.62, 0.68, -2.12);
      g.add(tl);
    }
    // 轮子
    var wheelGeo = new THREE.CylinderGeometry(0.48, 0.48, 0.34, 12);
    var wheelMat = new THREE.MeshStandardMaterial({ color: 0x0c0e13, roughness: 0.9 });
    var wheels = [];
    for (var wx = -1; wx <= 1; wx += 2) {
      for (var wz = -1; wz <= 1; wz += 2) {
        var w = new THREE.Mesh(wheelGeo, wheelMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(wx * 0.98, 0.48, wz * 1.42);
        w.castShadow = true;
        g.add(w);
        wheels.push(w);
      }
    }
    g.userData.wheels = wheels;
    return g;
  }

  var playerCar = makeCar(0xe63946);
  scene.add(playerCar);

  /* ================= NPC 车 ================= */
  var npcs = [];
  var NPC_COLORS = [0x3b7dd8, 0xe8b93a, 0xe8eaf0, 0x3fae74, 0x8a5ad4, 0xff8c00];
  function spawnNpcs() {
    for (var i = 0; i < 18; i++) {
      var m = makeCar(NPC_COLORS[i % NPC_COLORS.length]);
      var npc = {
        mesh: m,
        t: Math.random(),
        lateral: (Math.random() - 0.5) * 1.4,
        speed: 22 + Math.random() * 26,
        oncoming: (i % 3 === 0)
      };
      if (npc.oncoming) npc.speed = -(26 + Math.random() * 22);
      scene.add(m);
      npcs.push(npc);
    }
  }
  spawnNpcs();

  /* ================= 状态 ================= */
  var player = {
    t: 0,                // 沿曲线参数 0~1
    lateral: 0.15,       // -1~1（路面内）
    speed: 0,
    MAX_SPEED: 96,
    lap: 1, totalLaps: 2,
    lastT: 0,
    finished: false,
    finishTime: 0
  };
  var running = false, paused = false;
  var camMode = 0;    // 0=跟随 1=车头 2=远景
  var raceStart = 0, lapStart = 0;
  var input = { gas: false, brake: false, left: false, right: false };

  var elSpd = document.getElementById('spd');
  var elLap = document.getElementById('lap');
  var elT1 = document.getElementById('t1');
  var elMsg = document.getElementById('msg');
  var overlay = document.getElementById('overlay');
  var msgTimer = 0, clock = 0;

  function setMsg(txt, dur) { elMsg.textContent = txt; elMsg.style.opacity = '1'; msgTimer = dur; }

  /* ================= 输入 ================= */
  var KEY = {
    KeyW: 'gas', ArrowUp: 'gas',
    KeyS: 'brake', ArrowDown: 'brake',
    KeyA: 'left', ArrowLeft: 'left',
    KeyD: 'right', ArrowRight: 'right'
  };
  window.addEventListener('keydown', function (e) {
    if (KEY[e.code]) { input[KEY[e.code]] = true; e.preventDefault(); return; }
    if (e.code === 'KeyC') { camMode = (camMode + 1) % 3; setMsg(['跟随', '车头', '远景'][camMode], 0.7); e.preventDefault(); }
    if (e.code === 'KeyR') { restart(); e.preventDefault(); }
    if (e.code === 'Space') { if (!running) startRace(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if (KEY[e.code]) { input[KEY[e.code]] = false; e.preventDefault(); }
  });
  function bindTouch(id, act) {
    var el = document.getElementById(id);
    if (!el) return;
    var set = function (v) { return function (ev) { input[act] = v; ev.preventDefault(); }; };
    el.addEventListener('pointerdown', set(true), { passive: false });
    el.addEventListener('pointerup', set(false), { passive: false });
    el.addEventListener('pointercancel', set(false), { passive: false });
    el.addEventListener('pointerleave', set(false), { passive: false });
  }
  bindTouch('tl', 'left'); bindTouch('tr', 'right'); bindTouch('tg', 'gas');

  /* ================= 辅助：曲线上的位置 ================= */
  function posAt(t, lateral) {
    var tt = ((t % 1) + 1) % 1;
    var p = curve.getPointAt(tt);
    var tan = curve.getTangentAt(tt).normalize();
    var side = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tan).normalize();
    return {
      pos: p.clone().addScaledVector(side, lateral * (ROAD_W / 2 - 1.2)),
      tan: tan,
      side: side
    };
  }

  /* ================= 更新 ================= */
  function update(dt) {
    if (!running || paused) return;
    clock += dt;

    // 速度
    if (input.gas) player.speed += 42 * dt;
    else if (input.brake) player.speed -= 70 * dt;
    else player.speed -= 16 * dt;
    player.speed = Math.max(-22, Math.min(player.MAX_SPEED, player.speed));

    // 前进（速度越快，t 变化越快）
    var dT = (player.speed * dt) / trackLen;
    player.t += dT;

    // 转向
    var steer = 0;
    if (input.left) steer -= 1;
    if (input.right) steer += 1;
    var steerRate = 1.35 * (0.35 + Math.abs(player.speed) / player.MAX_SPEED);
    player.lateral += steer * steerRate * dt;
    // 离心力
    var cur = curvatureAt(player.t);
    player.lateral -= cur * (player.speed / player.MAX_SPEED) * 0.42 * dt;
    // 出界减速
    if (Math.abs(player.lateral) > 1) {
      player.lateral = Math.max(-1.6, Math.min(1.6, player.lateral));
      player.speed *= Math.pow(0.55, dt * 3);
    }
    player.lateral = Math.max(-1.7, Math.min(1.7, player.lateral));

    // 圈数
    var tp = ((player.t % 1) + 1) % 1;
    if (player.lastT > 0.75 && tp < 0.25) {
      player.lap++;
      var now = performance.now();
      var lapT = (now - lapStart) / 1000;
      lapStart = now;
      if (player.lap > player.totalLaps) {
        player.finished = true;
        player.finishTime = (now - raceStart) / 1000;
        running = false;
        setMsg('完成！' + player.finishTime.toFixed(2) + 's', 6);
        overlay.classList.remove('hide');
      } else {
        setMsg('第 ' + (player.lap - 1) + ' 圈 ' + lapT.toFixed(2) + 's', 1.6);
      }
    }
    player.lastT = tp;

    // NPC
    for (var i = 0; i < npcs.length; i++) {
      var n = npcs[i];
      n.t += (n.speed * dt) / trackLen;
      if (n.t > 1) n.t -= 1;
      if (n.t < 0) n.t += 1;
      // 碰撞检测
      var dtl = Math.abs(((n.t - player.t + 0.5 + 1) % 1) - 0.5);
      if (dtl < 0.006 / (ROAD_W / 16) && Math.abs(n.lateral - player.lateral) < 0.62) {
        var rel = Math.abs(player.speed - n.speed);
        player.speed *= 0.45;
        n.lateral += (n.lateral > player.lateral ? 1 : -1) * 0.5;
        setMsg('碰撞！', 0.8);
        shake = Math.max(shake, 0.6);
      }
    }

    // 消息淡出
    if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) elMsg.style.opacity = '0'; }
    updateHud();
  }

  var shake = 0;

  function curvatureAt(t) {
    var eps = 0.004;
    var t1 = ((t - eps) % 1 + 1) % 1, t2 = ((t + eps) % 1 + 1) % 1;
    var a = curve.getTangentAt(t1).normalize();
    var b = curve.getTangentAt(t2).normalize();
    // 转向量的 y 分量（左右偏）
    return b.x * a.z - b.z * a.x;
  }

  function updateHud() {
    elSpd.textContent = String(Math.round(Math.abs(player.speed) * 3.6 * 1.15));   // 近似 km/h
    elLap.textContent = String(Math.min(player.lap, player.totalLaps));
    var now = performance.now();
    elT1.textContent = (Math.max(0, (now - lapStart) / 1000)).toFixed(2);
  }

  /* ================= 渲染循环 ================= */
  var lastTs = 0;
  function frame(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    update(dt);

    // 玩家车位置
    var pp = posAt(player.t, player.lateral);
    playerCar.position.copy(pp.pos);
    playerCar.position.y += 0.05;
    // 朝向切线
    var lookTarget = pp.pos.clone().add(pp.tan);
    playerCar.lookAt(lookTarget.x, pp.pos.y + 0.05, lookTarget.z);
    // 转向倾斜
    playerCar.rotation.z = (input.left ? 0.05 : 0) + (input.right ? -0.05 : 0);
    // 轮子转动
    var ws = playerCar.userData.wheels || [];
    for (var w = 0; w < ws.length; w++) ws[w].rotation.x += player.speed * dt * 1.6;

    // 相机
    var camOff, camH, camDist;
    if (camMode === 0) { camOff = 0; camH = 3.4; camDist = 8.5; }
    else if (camMode === 1) { camOff = 0; camH = 1.7; camDist = 1.2; }
    else { camOff = 0; camH = 8.5; camDist = 15; }
    var back = pp.tan.clone().multiplyScalar(-camDist);
    var camPos = pp.pos.clone().add(back).add(new THREE.Vector3(0, camH, 0));
    // 震动
    if (shake > 0.01) {
      camPos.x += (Math.random() - 0.5) * shake * 0.8;
      camPos.y += (Math.random() - 0.5) * shake * 0.8;
      shake = Math.max(0, shake - dt * 2.4);
    }
    camera.position.lerp(camPos, camMode === 1 ? 1 : Math.min(1, dt * 7));
    var lookAt = pp.pos.clone().addScaledVector(pp.tan, 8);
    camera.lookAt(lookAt.x, pp.pos.y + (camMode === 1 ? 0.8 : 1.6), lookAt.z);
    // 相机随速度提升 FOV（速度感）
    camera.fov = 70 + Math.min(16, Math.abs(player.speed) / player.MAX_SPEED * 16);
    camera.updateProjectionMatrix();

    // NPC 位置
    for (var i = 0; i < npcs.length; i++) {
      var n = npcs[i];
      var np = posAt(n.t, n.lateral);
      n.mesh.position.copy(np.pos);
      var dir = n.oncoming ? np.tan.clone().multiplyScalar(-1) : np.tan;
      n.mesh.lookAt(np.pos.x + dir.x, np.pos.y, np.pos.z + dir.z);
      var nw = n.mesh.userData.wheels || [];
      for (var k = 0; k < nw.length; k++) nw[k].rotation.x += n.speed * dt * 1.6;
    }

    // 阳光跟随玩家（保持阴影范围）
    sun.position.set(pp.pos.x + 90, pp.pos.y + 140, pp.pos.z + 60);
    sun.target.position.copy(pp.pos);
    sun.target.updateMatrixWorld();

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  /* ================= 流程 ================= */
  function startRace() {
    player.t = 0; player.lateral = 0.15; player.speed = 0;
    player.lap = 1; player.lastT = 0; player.finished = false;
    overlay.classList.add('hide');
    running = true;
    raceStart = performance.now();
    lapStart = raceStart;
    setMsg('GO!', 0.9);
  }
  function restart() {
    overlay.classList.remove('hide');
    running = false;
    player.speed = 0;
  }

  document.getElementById('startBtn').addEventListener('click', startRace);

  window.addEventListener('resize', function () {
    W = window.innerWidth; H = window.innerHeight;
    camera.aspect = W / H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });

  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
