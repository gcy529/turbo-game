<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1230" />
<title>TURBO 3D · 极速狂飙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070e;
  transition:background .4s;font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#eaf2ff;user-select:none;-webkit-tap-highlight-color:transparent}
#game{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:14px;top:12px;z-index:10;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:13px;background:rgba(6,12,22,.6);border:1px solid rgba(120,190,255,.25);backdrop-filter:blur(8px)}
#spd{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.u{font-size:10px;color:#7fb6e8;font-weight:700;letter-spacing:1px}
#meta{font-size:11.5px;color:#9dbdd8;line-height:1.5;font-variant-numeric:tabular-nums}
#meta b{color:#fff}
#msg{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font-size:56px;font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 40px rgba(120,200,255,.9);opacity:0;transition:opacity .25s;pointer-events:none;z-index:12;white-space:nowrap}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(18,36,72,.92),rgba(4,6,14,.98));
  body.light3d #overlay{background:radial-gradient(circle at 50% 40%,rgba(230,240,252,.94),rgba(190,210,235,.98))}z-index:20;transition:opacity .35s;padding:18px}
#overlay.hide{opacity:0;pointer-events:none}
.panel{text-align:center;padding:26px 30px;border-radius:22px;background:rgba(10,18,34,.86);border:1px solid rgba(120,190,255,.25);box-shadow:0 24px 90px rgba(0,0,0,.7);backdrop-filter:blur(16px);max-width:94vw}
.title{font-size:36px;font-weight:900;letter-spacing:5px;background:linear-gradient(180deg,#fff,#67c6ff 70%,#2f7fd0);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:3px}
  body.light3d .title{background:linear-gradient(180deg,#1a3a6e,#1f6fd0);-webkit-background-clip:text;background-clip:text}
  body.light3d .tip{color:#2a4a70}
  body.light3d .invbtn,body.light3d .invbtn.on{color:#8a5a10;background:rgba(255,190,80,.15);border-color:rgba(200,140,30,.5)}
.sub{font-size:10.5px;letter-spacing:4px;color:#5f86ad;margin-bottom:18px;font-weight:700}
.tag3d{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:2px;padding:3px 10px;border-radius:7px;background:rgba(255,180,60,.2);border:1px solid rgba(255,190,80,.6);color:#ffc078;margin-bottom:12px}
.go{font-size:15px;font-weight:800;letter-spacing:2px;color:#06121e;background:linear-gradient(180deg,#8ef7c8,#38d99a);padding:13px 40px;border-radius:13px;display:inline-block;box-shadow:0 10px 30px rgba(60,220,160,.35);cursor:pointer;border:0}
.tip{margin-top:12px;font-size:10.5px;color:#4e6b88;letter-spacing:.5px}
#touch{position:fixed;inset:auto 0 0 0;height:180px;z-index:11;pointer-events:none;display:none}
.tb{width:88px;height:88px;border-radius:50%;background:rgba(140,200,255,.2);border:3px solid rgba(140,200,255,.5);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#e8f4ff;pointer-events:auto;backdrop-filter:blur(6px);touch-action:none;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.tb:active{background:rgba(140,200,255,.4)}
.tb-gas{background:rgba(60,220,160,.25);border-color:rgba(80,230,170,.7);color:#c8ffe8}
@media (hover:none) and (pointer:coarse){#touch{display:block}}
#invBadge{display:inline-block;font-size:11px;font-weight:900;letter-spacing:1.5px;padding:6px 16px;border-radius:999px;background:rgba(255,180,60,.18);border:1.5px solid rgba(255,190,80,.6);color:#ffc078;margin-bottom:14px;animation:invPulse 1.6s ease-in-out infinite}
#invBadge.off{background:rgba(255,255,255,.06);border-color:rgba(140,200,255,.28);color:#8ba3bd;animation:none}
@keyframes invPulse{0%,100%{opacity:1}50%{opacity:.6}}
#fpsBox{position:fixed;right:12px;bottom:12px;z-index:13;padding:4px 9px;border-radius:8px;background:rgba(6,12,22,.7);border:1px solid rgba(140,200,255,.22);font-size:10.5px;font-weight:800;color:#8ef7c8;font-variant-numeric:tabular-nums}
#skillUI3d{position:fixed;right:14px;top:70px;z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:6px;opacity:0;transition:opacity .3s}
#skillUI3d.show{opacity:1}
#skillPts3d{font-size:16px;font-weight:900;color:#ffd166;text-shadow:0 0 12px rgba(255,209,102,.8)}
#skillBtns3d{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.skill-btn{padding:5px 10px;border-radius:8px;border:1.5px solid rgba(140,200,255,.3);background:rgba(6,12,22,.6);color:#e8f4ff;font-size:11px;font-weight:800;cursor:pointer;backdrop-filter:blur(6px);transition:all .15s}
.skill-btn:hover{background:rgba(140,200,255,.2)}
.skill-btn.active{border-color:#ffd166;box-shadow:0 0 10px rgba(255,209,102,.5)}
#skillBar3d{display:none;align-items:center;gap:8px;padding:6px 12px;border-radius:10px;background:rgba(6,12,22,.8);border:1.5px solid rgba(140,200,255,.4);backdrop-filter:blur(8px)}
.skill-name{font-size:12px;font-weight:800;color:#fff}
.skill-timer{font-size:11px;color:#ffd166;font-weight:900}
</style>
</head>
<body>

<div id="msg"></div>
<div id="keyHints" style="position:fixed;left:50%;top:12%;transform:translateX(-50%);z-index:11;display:none;grid-template-columns:auto auto;gap:6px 16px;font-size:11.5px;color:#a9c6e2;text-align:left;background:rgba(6,12,22,.72);border:1px solid rgba(140,200,255,.25);border-radius:12px;padding:10px 14px;backdrop-filter:blur(6px);pointer-events:none">
  <span style="font-weight:800;color:#fff">A</span>/<span style="font-weight:800;color:#fff">←</span> 左 &nbsp;&nbsp; <span style="font-weight:800;color:#fff">D</span>/<span style="font-weight:800;color:#fff">→</span> 右<br>
  <span style="font-weight:800;color:#fff">S</span>/<span style="font-weight:800;color:#fff">↓</span> 手刹 &nbsp;&nbsp; <span style="font-weight:800;color:#fff">C</span> 切视角 &nbsp;&nbsp; <span style="font-weight:800;color:#fff">R</span> 重开

<div id="touch">
  <div class="tb" id="tl" style="position:absolute;left:16px;bottom:22px">◀</div>

  <div class="tb tb-gas" id="tg" style="position:absolute;left:50%;bottom:22px;transform:translateX(-50%)">▲</div>
</div>
<div id="overlay">
  <div class="panel">
    <div class="tag3d" id="d3tag">WEBGL · 内测版</div>
    <div id="d3lock" style="display:none;flex-direction:column;align-items:center;gap:4px;margin-bottom:12px">
      <div style="font-size:10.5px;letter-spacing:2px;color:#8ba3bd">内测版 · 距正式版</div>
      <div id="d3cd" style="font-family:'Courier New',monospace;font-size:20px;font-weight:900;letter-spacing:2px;color:#ffe600;text-shadow:0 0 10px rgba(255,230,0,.5)"></div>
      <div style="font-size:9.5px;letter-spacing:1px;color:#5f7a95">2026.11.11 全量解锁 · 敬请期待</div>
    </div>
    <div class="title">逆反 3D</div>
    <div class="sub">T U R B O &nbsp; I N V E R S E</div>
    <div id="invBadge" style="display:none">↔ 逆反模式 开启</div>
    <div id="invBox" style="display:none;flex-direction:column;align-items:center;margin-bottom:14px">
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="invbtn on" data-inv="1" style="padding:9px 18px;border-radius:10px;border:1.5px solid rgba(255,190,80,.6);background:rgba(255,180,60,.22);color:#ffc078;font-size:12.5px;font-weight:900;cursor:pointer">正常转向？</button>
        <button class="invbtn" data-inv="0" style="padding:9px 18px;border-radius:10px;border:1.5px solid rgba(140,200,255,.25);background:rgba(255,255,255,.06);color:#9dbdd8;font-size:12.5px;font-weight:900;cursor:pointer">原样转向？</button>
      </div>
      <div style="font-size:10px;color:#6f8db0;margin-top:7px">🏆 已解锁 · 跑完一局的奖励</div>
    </div>
    <div id="invLock" style="font-size:10.5px;color:#4e6b88;margin-bottom:14px;letter-spacing:.5px">🔒 跑完一局，解锁点什么</div>
    <div id="invExplain" style="display:none;font-size:11.5px;line-height:1.95;color:#a9c6e2;max-width:300px;margin:0 auto 16px;text-align:left">
      <div>↔ 你已经知道了，对吧？</div>
    </div>
    <button class="go" id="startBtn">开始比赛</button>
    <div class="tip">按键提示：开始后屏幕上方弹 3 秒</div>
    <div class="tip" style="font-size:9.5px;color:#4e6b88">需 iOS 10+ / 较新浏览器 · 老设备请玩 2D 版</div>
    <div class="tip" style="margin-top:10px"><a href="index.html" style="color:#67c6ff;text-decoration:none">← 回到 2D 版</a></div>
  </div>
</div>
<script src="three.min.js"></script>
<script>
(function () {
'use strict';
var canvas = document.getElementById("game");
var W = window.innerWidth, H = window.innerHeight;
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
// 手机普及：pixelRatio 上限 1.5（省 40% 填充率），桌面仍保持高清
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
var scene = new THREE.Scene();
  // ── 日夜主题（与 2D 版同步：读 turbo-racer-theme）──
  var THEME3D = 'dark';
  try { var _t3 = localStorage.getItem('turbo-racer-theme'); if (_t3 === 'light' || _t3 === 'dark') THEME3D = _t3; } catch (e) {}
  function applySceneTheme() {
    if (THEME3D === 'light') {
      scene.background = new THREE.Color(0x87b5e8);       // 白天：亮蓝天空
      scene.fog = new THREE.Fog(0xc4d8ef, 140, 520);
      sun.intensity = 1.5;
      sun.color.set(0xffffff);
      hemi.color.set(0xffffff);
      hemi.groundColor.set(0x9db8cc);
    } else {
      scene.background = new THREE.Color(0x0b1230);       // 夜间：深蓝
      scene.fog = new THREE.Fog(0x1a2444, 90, 340);
      sun.intensity = 1.3;
      sun.color.set(0xffddaa);
      hemi.color.set(0x99bbff);
      hemi.groundColor.set(0x223311);
    }
  }
scene.background = new THREE.Color(0x0b1230);
scene.fog = new THREE.Fog(0x1a2444, 110, 420);
var camera = new THREE.PerspectiveCamera(72, W / H, 0.5, 900);
var hemi = new THREE.HemisphereLight(0x99bbff, 0x223311, 0.75);
scene.add(hemi);
var sun = new THREE.DirectionalLight(0xffddaa, 1.15);
sun.position.set(90, 140, 60);
sun.castShadow = true;
// 手机普及：阴影贴图 512 + 正交视锥跟随玩家（只照玩家附近，远处不浪费）
sun.shadow.mapSize.set(512, 512);
sun.shadow.camera.near = 10; sun.shadow.camera.far = 300;
sun.shadow.camera.left = -70; sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70; sun.shadow.camera.bottom = -70;
scene.add(sun);
scene.add(sun.target);
scene.add(new THREE.AmbientLight(0x404060, 0.5));
var ambientLight = scene.children[scene.children.length - 1];
// 应用日夜主题（此时 scene/sun/hemi 已就绪）
applySceneTheme();
document.body.className = (THEME3D === 'light') ? 'light3d' : '';
// ── 赛道 ──
var SEG_COUNT = 420, ROAD_W = 16, curve = null, trackLen = 0;
function buildTrackCurve() {
  var pts = [], R = 200, n = 12;
  for (var i = 0; i < n; i++) {
    var a = (i / n) * Math.PI * 2;
    var r = R + Math.sin(i * 1.7) * 55 + Math.cos(i * 2.3) * 38;
    var y = Math.sin(i * 0.9) * 14 + Math.cos(i * 1.4) * 9;
    pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  curve = new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.5);
}
buildTrackCurve();
function buildRoad() {
  var pos = [], uvs = [], idx = [], railPos = [], railIdx = [];
  for (var i = 0; i <= SEG_COUNT; i++) {
    var t = i / SEG_COUNT;
    var p = curve.getPointAt(t % 1);
    var tan = curve.getTangentAt(t % 1).normalize();
    var side = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tan).normalize();
    var L = p.clone().addScaledVector(side, -ROAD_W / 2);
    var R2 = p.clone().addScaledVector(side, ROAD_W / 2);
    pos.push(L.x, L.y, L.z, R2.x, R2.y, R2.z);
    uvs.push(0, t * 40, 1, t * 40);
    for (var s = -1; s <= 1; s += 2) {
      var b = p.clone().addScaledVector(side, s * (ROAD_W / 2 + 0.6));
      railPos.push(b.x, b.y, b.z, b.x, b.y + 1.5, b.z);
    }
    if (i > 0) { var a = (i - 1) * 2, bb = a + 1, c = i * 2, d = c + 1; idx.push(a, bb, c, bb, d, c); }
  }
  for (var k = 0; k < SEG_COUNT; k++) { var r0 = k * 4, r1 = (k + 1) * 4; railIdx.push(r0, r0 + 1, r1, r0 + 1, r1 + 1, r1, r0 + 2, r0 + 3, r1 + 2, r0 + 3, r1 + 3, r1 + 2); }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx); g.computeVertexNormals();
  var road = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x4a4a55, roughness: 0.85 }));
  road.receiveShadow = true; scene.add(road);
  // 路面标线：中央白色虚线 + 左右黄色边线
  var laneWhite = [], laneWhiteIdx = [], edgeY = [], edgeYIdx = [];
  var lwi = 0;
  for (var m0 = 0; m0 <= SEG_COUNT; m0++) {
    var tm0 = m0 / SEG_COUNT;
    var pm0 = curve.getPointAt(tm0 % 1);
    var sm0 = new THREE.Vector3().crossVectors(
      new THREE.Vector3(0, 1, 0), curve.getTangentAt(tm0 % 1).normalize()).normalize();
    var py = pm0.y + 0.03;
    // 中央白线（做虚线：每隔 12 段画 5 段）——独立小 quad，索引不跨段
    if (m0 % 12 < 5 && m0 > 0) {
      var pmPrev = curve.getPointAt(((m0 - 1) / SEG_COUNT) % 1);
      var smPrev = new THREE.Vector3().crossVectors(
        new THREE.Vector3(0, 1, 0), curve.getTangentAt(((m0 - 1) / SEG_COUNT) % 1).normalize()).normalize();
      laneWhite.push(
        pmPrev.x - smPrev.x * 0.12, py, pmPrev.z - smPrev.z * 0.12,
        pmPrev.x + smPrev.x * 0.12, py, pmPrev.z + smPrev.z * 0.12,
        pm0.x - sm0.x * 0.12, py, pm0.z - sm0.z * 0.12,
        pm0.x + sm0.x * 0.12, py, pm0.z + sm0.z * 0.12);
      laneWhiteIdx.push(lwi, lwi + 1, lwi + 2, lwi + 1, lwi + 3, lwi + 2);
      lwi += 4;
    }
    // 黄色边线：左右各一条（连续实线，宽度 0.22，色偏暗）
    for (var es = -1; es <= 1; es += 2) {
      var off = es * (ROAD_W / 2 - 0.6);
      var ex1 = pm0.x + sm0.x * (off - es * 0.11), ez1 = pm0.z + sm0.z * (off - es * 0.11);
      var ex2 = pm0.x + sm0.x * (off + es * 0.11), ez2 = pm0.z + sm0.z * (off + es * 0.11);
      var ebase = m0 * 4 + (es === -1 ? 0 : 2);
      edgeY.push(ex1, py, ez1, ex2, py, ez2);
      if (m0 > 0) {
        var p = ebase - 4;
        edgeYIdx.push(p, p + 1, ebase, p + 1, ebase + 1, ebase);
      }
    }
  }
  var dashG = new THREE.BufferGeometry();
  dashG.setAttribute("position", new THREE.Float32BufferAttribute(laneWhite, 3));
  dashG.setIndex(laneWhiteIdx);
  scene.add(new THREE.Mesh(dashG, new THREE.MeshBasicMaterial({ color: 0xf5f7fa, transparent: true, opacity: 0.85, side: THREE.DoubleSide })));
  var edgeG = new THREE.BufferGeometry();
  edgeG.setAttribute("position", new THREE.Float32BufferAttribute(edgeY, 3));
  edgeG.setIndex(edgeYIdx);
  scene.add(new THREE.Mesh(edgeG, new THREE.MeshBasicMaterial({ color: 0xc9a227, side: THREE.DoubleSide })));
  var cPos = [], cIdx = [];
  for (var m = 0; m <= SEG_COUNT; m++) {
    var tm = m / SEG_COUNT;
    var pm = curve.getPointAt(tm % 1);
    var tm2 = curve.getTangentAt(tm % 1).normalize();
    var sm = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tm2).normalize();
    cPos.push(pm.x - sm.x * 0.22, pm.y + 0.02, pm.z - sm.z * 0.22, pm.x + sm.x * 0.22, pm.y + 0.02, pm.z + sm.z * 0.22);
    if (m > 0) { var ca = (m - 1) * 2; cIdx.push(ca, ca + 1, ca + 2, ca + 1, ca + 3, ca + 2); }
  }
  var cg = new THREE.BufferGeometry();
  cg.setAttribute("position", new THREE.Float32BufferAttribute(cPos, 3));
  cg.setIndex(cIdx); cg.computeVertexNormals();
  scene.add(new THREE.Mesh(cg, new THREE.MeshBasicMaterial({ color: 0xdfe7f2 })));
  var rg = new THREE.BufferGeometry();
  rg.setAttribute("position", new THREE.Float32BufferAttribute(railPos, 3));
  rg.setIndex(railIdx); rg.computeVertexNormals();
  scene.add(new THREE.Mesh(rg, new THREE.MeshStandardMaterial({ color: 0xd0d8e4, roughness: 0.6, metalness: 0.35, side: THREE.DoubleSide })));
  trackLen = curve.getLength();
}
buildRoad();
function addScenery() {
  var tGeo = new THREE.ConeGeometry(2.2, 7, 6), trGeo = new THREE.CylinderGeometry(0.35, 0.45, 2, 5);
  var tMat = new THREE.MeshStandardMaterial({ color: 0x1a6b46, roughness: 0.9 });
  var trMat = new THREE.MeshStandardMaterial({ color: 0x3a2b1e, roughness: 1 });
  // 手机普及：树 150→100、灯柱 60→40；树/灯柱不再 castShadow（只留车）
  for (var i = 0; i < 100; i++) {
    var t = i / 150;
    var p = curve.getPointAt(t);
    var tan = curve.getTangentAt(t).normalize();
    var side = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tan).normalize();
    var dist = ROAD_W / 2 + 4 + Math.random() * 18;
    var pos = p.clone().addScaledVector(side, (i % 2 === 0 ? 1 : -1) * dist);
    var g = new THREE.Group();
    var tr = new THREE.Mesh(trGeo, trMat); tr.position.y = 1;
    var top = new THREE.Mesh(tGeo, tMat); top.position.y = 5;
    g.add(tr); g.add(top); g.position.copy(pos); g.scale.setScalar(0.7 + Math.random() * 0.8);
    scene.add(g);
  }
  var pGeo = new THREE.CylinderGeometry(0.16, 0.16, 7, 6);
  var pMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.7 });
  for (var j = 0; j < 40; j++) {
    var tj = j / 60;
    var pj = curve.getPointAt(tj);
    var tanj = curve.getTangentAt(tj).normalize();
    var sj = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tanj).normalize();
    var pole = new THREE.Mesh(pGeo, pMat);
    pole.position.copy(pj.clone().addScaledVector(sj, (j % 2 ? 1 : -1) * (ROAD_W / 2 + 2.5)));
    pole.position.y += 3.5; scene.add(pole);
  }
}
addScenery();
// 赛博朋克车（2030+风格）：棱角分明、发光边线、低趴宽体
function makeCar(color) {

    var tl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.04), tailEdgeMat);
    tl.position.set(ts * 0.65, 0.5, -2.02); g.add(tl);

  var wMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.85 });
  var hubMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.3, metalness: 0.9 });
  // 轮毂发光环
  var ringGeo = new THREE.TorusGeometry(0.2, 0.025, 8, 16);
  var ringMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, emissive: 0x00ccff, emissiveIntensity: 0.8 });

  var wheelSpin = [];
  var wheelPositions = [
    [-1.0, 0.44,  1.3],  // 前左
    [ 1.0, 0.44,  1.3],  // 前右
    [-1.0, 0.44, -1.3],  // 后左
    [ 1.0, 0.44, -1.3],  // 后右
  ];

    var wp = wheelPositions[wi];
    var wHolder = new THREE.Group();
    wHolder.position.set(wp[0], wp[1], wp[2]);
    var wRot = new THREE.Group();
    var w = new THREE.Mesh(wGeo, wMat);
    w.rotation.z = Math.PI / 2;
    wRot.add(w);
    // 轮毂
    var hub = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.34, 8), hubMat);
    hub.rotation.z = Math.PI / 2;
    wRot.add(hub);
    // 发光轮毂环
    var ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.y = Math.PI / 2;
    wRot.add(ring);
    wHolder.add(wRot);
    wHolder.castShadow = true;
    g.add(wHolder);
    wheelSpin.push(wRot);
  }
  g.userData.wheelSpin = wheelSpin;
  return g;
}

  }
  // 逆行提示：速度为负且足够快时显示
  if (revDriveEl) {
    var revNow = player.speed < -15;
    if (revNow && !revDriveEl._shown) { revDriveEl.style.opacity = "1"; revDriveEl._shown = true; }
    else if (!revNow && revDriveEl._shown) { revDriveEl.style.opacity = "0"; revDriveEl._shown = false; }
  }
  updateHud();
}
// 名字（与 2D 共享 turbo-racer-name）
  function getLastName3d() { try { return (localStorage.getItem('turbo-racer-name') || '玩家').slice(0, 12); } catch (e) { return '玩家'; } }
  // 3D 积分：速度+漂移简化版
  function calcScore3d(p) {
    if (!p) return 0;
    var finish = p.finished ? Math.max(0, Math.round(2000 - (p.finishTime || 0) * 12)) : 0;
    return Math.round((p.driftScore || 0)) + (p.smashCount || 0) * 200 + finish;
  }
  function updateHud() {
  elSpd.textContent = String(Math.round(Math.abs(player.speed) * 3.6 * 1.15));
  elLap.textContent = String(Math.min(player.lap, player.totalLaps));
  elT1.textContent = (Math.max(0, (performance.now() - lapStart) / 1000)).toFixed(2);
  var sc3 = document.getElementById('score3d');
  if (sc3) sc3.textContent = String(calcScore3d(player));
  var who3 = document.getElementById('who3d');
  if (who3) who3.textContent = getLastName3d();
  // ── 技能 HUD ──
  var elSkillPts = document.getElementById('skillPts3d');
  var elSkillBar = document.getElementById('skillBar3d');
  if (elSkillPts) elSkillPts.textContent = '⭐ ' + player.skillPoints;
  if (elSkillBar) {
    var active = player.activeSkill;
    var def = SKILL_DEFS_3D[active];
    if (def) {
      elSkillBar.style.display = 'flex';
      elSkillBar.querySelector('.skill-name').textContent = def.icon + ' ' + def.name;
      elSkillBar.querySelector('.skill-timer').textContent = Math.ceil(player.skillTimer) + 's';
      elSkillBar.style.borderColor = '#' + def.color.toString(16).padStart(6, '0');
    } else {
      elSkillBar.style.display = 'none';
    }
  }
}
var lastTs = 0, fpsAcc = 0, fpsN = 0;
function frame(ts) {
  if (!lastTs) lastTs = ts;
  var dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  fpsAcc += dt; fpsN++;
  var fvShow = 0;
  if (fpsAcc >= 0.5) { fvShow = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  if (fvShow) { elFps.textContent = fvShow + " FPS"; elFps.style.color = fvShow >= 45 ? "#8ef7c8" : (fvShow >= 25 ? "#ffd166" : "#ff6b6b"); }
  update(dt);
  var pp = posAt(player.t, player.lateral);
  // 车头始终朝「实际行驶方向」：前进时 +Z 指 tan，倒车时车头自动转 180°（不再"反"）
  playerCar.position.copy(pp.pos);
  playerCar.position.y += 0.05;
  var fwd = pp.tan.clone();
  if (player.speed < -1) fwd.multiplyScalar(-1);   // 倒车时车头转过来
  // 用四元数平滑转向（lerp 防画面乱跳，替代生硬 lookAt）
  var tmpObj = new THREE.Object3D();
  tmpObj.position.copy(playerCar.position);
  var lookTgt = playerCar.position.clone().sub(fwd);
  tmpObj.lookAt(lookTgt.x, playerCar.position.y, lookTgt.z);
  playerCar.quaternion.slerp(tmpObj.quaternion, Math.min(1, dt * 10));
  // 转向侧倾（视觉用，幅度小；每帧从 0 重算目标，不残留）
  var steerVis = 0;
  if (input.left) steerVis += 0.06;
  if (input.right) steerVis -= 0.06;
  playerCar._rollT = (playerCar._rollT || 0) + (steerVis - (playerCar._rollT || 0)) * Math.min(1, dt * 8);
  playerCar.rotation.z = playerCar._rollT;
  // 轮子滚动：只转轮心（wRot），轴保持朝左右
  var ws2 = playerCar.userData.wheelSpin || [];
  for (var w = 0; w < ws2.length; w++) {
    ws2[w].rotation.x -= player.speed * dt * 0.9;
  }
  var camH, camDist;
  if (camMode === 1) { camH = 1.7; camDist = 1.2; }
  else if (camMode === 2) { camH = 8.5; camDist = 15; }
  else { camH = 3.4; camDist = 8.5; }
  var back = pp.tan.clone().multiplyScalar(-camDist);
  var camPos = pp.pos.clone().add(back).add(new THREE.Vector3(0, camH, 0));
  if (shake > 0.01) { camPos.x += (Math.random() - 0.5) * shake * 0.8; camPos.y += (Math.random() - 0.5) * shake * 0.8; shake = Math.max(0, shake - dt * 2.4); }
  camera.position.lerp(camPos, camMode === 1 ? 1 : Math.min(1, dt * 7));
  var la = pp.pos.clone().addScaledVector(pp.tan, 8);
  camera.lookAt(la.x, pp.pos.y + (camMode === 1 ? 0.8 : 1.6), la.z);
  camera.fov = 70 + Math.min(16, Math.abs(player.speed) / player.MAX_SPEED * 16);
  camera.updateProjectionMatrix();
  for (var i = 0; i < npcs.length; i++) {
    var n = npcs[i];
    var np = posAt(n.t, n.lateral);
    n.mesh.position.copy(np.pos);
    // NPC 车头朝向自身行驶方向
    var nDir = (n.speed >= 0 ? 1 : -1);
    var nFwd = np.tan.clone().multiplyScalar(n.oncoming ? -nDir : nDir);
    var nObj = new THREE.Object3D();
    nObj.position.copy(n.mesh.position);
    var nTgt = n.mesh.position.clone().add(nFwd);
    nObj.lookAt(nTgt.x, n.mesh.position.y, nTgt.z);
    n.mesh.quaternion.slerp(nObj.quaternion, Math.min(1, dt * 8));
    var nw = n.mesh.userData.wheelSpin || [];
    for (var k = 0; k < nw.length; k++) {
      nw[k].rotation.x -= n.speed * dt * 0.9;
    }
  }
  sun.position.set(pp.pos.x + 90, pp.pos.y + 140, pp.pos.z + 60);
  sun.target.position.copy(pp.pos);
  sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function startRace() {
  player.t = 0; player.lateral = 0.15; player.speed = 0; player.lap = 1; player.lastT = 0; player.finished = false;
  player.pushLateral = 0;
  // ── 技能重置 ──
  player.skillPoints = 0; player.activeSkill = null; player.skillTimer = 0; player.skillGlow = 0;
  player.shieldActive = false; player.magnetRange = 0; player.timeSlow = 1;
  if (playerCar.userData.shieldMesh) {
    playerCar.remove(playerCar.userData.shieldMesh);
    playerCar.userData.shieldMesh.geometry.dispose();
    playerCar.userData.shieldMesh.material.dispose();
    playerCar.userData.shieldMesh = null;
  }
  overlay.classList.add("hide");
  running = true;
  countdown = 3.2; lastCountShown = -1;
  // 重置技能道具
  for (var si = 0; si < skillItems.length; si++) {
    skillItems[si].collected = false;
    skillItems[si].mesh.visible = true;
  }
  // 重置粒子
  particles3D = [];
  updateSkillBtns3d();
  setMsg("3", 0.9);
  // 按键提示：手机/触屏不显示；电脑显示 3 秒后自动消失
  var kh = document.getElementById("keyHints");
  if (kh) {
    var coarse = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
    if (!coarse) {
      kh.style.display = "grid";
      setTimeout(function () { kh.style.display = "none"; }, 3000);
    }
  }
}
function restart() { running = false; overlay.classList.remove("hide"); player.speed = 0; }
window.__T3 = {
  theme3d: function () { try { return { theme: THEME3D, bg: scene.background.getHexString(), fog: scene.fog.color.getHexString(), sunI: sun.intensity, bodyCls: document.body.className }; } catch (e) { return { err: String(e) }; } },
  state: function () { return { invert: INVERT, unlocked: UNLOCKED, speed: Math.round((Math.abs(player.speed) / player.MAX_SPEED) * 320), lateral: Number(player.lateral.toFixed(3)), t: Number(player.t.toFixed(3)), lap: player.lap, countdown: Number(countdown.toFixed(2)), running: running, camMode: camMode, autoGas: AUTO_GAS }; },
  steer: function (dir, ms) {
    var key = dir > 0 ? 'right' : 'left';
    input[key] = true;
    setTimeout(function () { input[key] = false; }, ms || 800);
    return true;
  },
  autoGas: function (v) { AUTO_GAS = !!v; return AUTO_GAS; },
  setInvert: function (v) { INVERT = !!v; syncInv(); return INVERT; },
  // 测试用：模拟跑完一局
  finishNow: function () {
    if (running) {
      player.finished = true; player.finishTime = 12.34; running = false;
      unlockSetting(); showFinishPanel();
    }
    return { unlocked: UNLOCKED };
  },
  resetUnlock: function () {
    UNLOCKED = false; INVERT = true;
    try { localStorage.removeItem('turbo3d-unlocked'); } catch (e) {}
    applyUnlockUi(); syncInv();
    return true;
  }
};
// ── 技能系统 ──
var SKILL_DEFS_3D = {
  shield:   { name: '护盾',   icon: '🛡️', cost: 50,   duration: 5, color: 0x4fc3f7 },
  magnet:   { name: '磁力',   icon: '🧲', cost: 40,   duration: 6, color: 0xef5350 },
  slow:     { name: '缓时',   icon: '⏳', cost: 60,   duration: 4, color: 0xab47bc },
  megaboost:{ name: '氮气',   icon: '🔥', cost: 80,   duration: 3, color: 0xff9800 }
};
window.activateSkill3d = function(type) {
  var def = SKILL_DEFS_3D[type];
  if (!def || !player) return;
  if (player.skillPoints < def.cost) {
    setMsg('💫 技能点不足！', 1);
    return;
  }
  if (player.activeSkill) {
    setMsg('⚡ 已有激活技能！', 1);
    return;
  }
  player.skillPoints -= def.cost;
  player.activeSkill = type;
  player.skillTimer = def.duration;
  player.skillGlow = 1.0;
  setMsg(def.icon + ' ' + def.name + ' 激活！', 1.2);
  // 粒子爆发
  var pPos = playerCar.position;
  for (var si = 0; si < 25; si++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 2 + Math.random() * 4;
    spawnParticle3D(
      pPos.x, pPos.y + 0.5, pPos.z,
      Math.cos(angle) * speed, 1 + Math.random() * 2, Math.sin(angle) * speed,
      (def.color >> 16 & 255) / 255,
      (def.color >> 8 & 255) / 255,
      (def.color & 255) / 255,
      0.3 + Math.random() * 0.3, 0.8 + Math.random() * 0.4
    );
  }
  updateSkillBtns3d();
};
function updateSkillBtns3d() {
  var btns = document.querySelectorAll('.skill-btn');
  btns.forEach(function(btn) {
    var type = btn.getAttribute('data-skill');
    var def = SKILL_DEFS_3D[type];
    if (!def) return;
    var canUse = player.skillPoints >= def.cost;
    var isActive = player.activeSkill === type;
    btn.style.opacity = canUse ? '1' : '0.4';
    btn.style.cursor = canUse ? 'pointer' : 'not-allowed';
    btn.classList.toggle('active', isActive);
  });
  var elSkillUI = document.getElementById('skillUI3d');
  if (elSkillUI) {
    elSkillUI.classList.toggle('show', player.skillPoints > 0 || player.activeSkill);
  }
}
// 启动时初始化
updateSkillBtns3d();
function unlockSetting() {
  if (UNLOCKED) return;
  UNLOCKED = true;
  try { localStorage.setItem('turbo3d-unlocked', '1'); } catch (e) {}
}
function applyUnlockUi() {
  var box = document.getElementById('invBox');
  var lock = document.getElementById('invLock');
  var badge = document.getElementById('invBadge');
  var exp = document.getElementById('invExplain');
  if (box) box.style.display = UNLOCKED ? 'flex' : 'none';
  if (lock) lock.style.display = UNLOCKED ? 'none' : 'block';
  if (badge) badge.style.display = UNLOCKED ? 'inline-block' : 'none';
  if (exp) exp.style.display = UNLOCKED ? 'block' : 'none';
}
function showFinishPanel() {
  var panel = document.querySelector('.panel');
  if (!panel) return;
  panel.innerHTML = '<div class="tag3d">RACE FINISHED</div>' +
    '<div class="title" style="font-size:30px">完成！</div>' +
    '<div class="sub" style="letter-spacing:3px">' + player.finishTime.toFixed(2) + ' 秒 · ' + player.totalLaps + ' 圈</div>' +
    '<div style="margin:18px 0;padding:14px 18px;border-radius:14px;background:rgba(255,180,60,.12);border:1.5px solid rgba(255,190,80,.5);max-width:300px">' +
    '<div style="font-size:14px;font-weight:900;color:#ffc078;letter-spacing:1px;margin-bottom:6px">🏆 解锁隐藏设置</div>' +
    '<div style="font-size:11.5px;color:#cfe4f7;line-height:1.7">有个开关解锁了<br><span style="color:#6f8db0;font-size:10.5px">下次开始前，试试换一种开法</span></div>' +
    '</div>' +
    '<button class="go" id="againBtn">再来一局</button>' +
    '<div class="tip" style="margin-top:10px"><a href="index.html" style="color:#67c6ff;text-decoration:none">← 回到 2D 版</a></div>';
  var ab = document.getElementById('againBtn');
  if (ab) ab.addEventListener('click', function () { location.reload(); });
  overlay.classList.remove('hide');
}
function syncInv() {
  var badge = document.getElementById('invBadge');
  if (badge) {
    badge.textContent = INVERT ? '↔ 模式 A' : '→ 模式 B';
    badge.className = INVERT ? '' : 'off';
  }
  var btns = document.querySelectorAll('.invbtn');
  for (var i = 0; i < btns.length; i++) {
    var on = (btns[i].getAttribute('data-inv') === '1') === INVERT;
    btns[i].className = 'invbtn' + (on ? ' on' : '');
    if (on) { btns[i].style.background = 'rgba(255,180,60,.22)'; btns[i].style.borderColor = 'rgba(255,190,80,.6)'; btns[i].style.color = '#ffc078'; }
    else { btns[i].style.background = 'rgba(255,255,255,.06)'; btns[i].style.borderColor = 'rgba(140,200,255,.25)'; btns[i].style.color = '#9dbdd8'; }
  }
}
(function () {
  try { UNLOCKED = (localStorage.getItem('turbo3d-unlocked') === '1'); } catch (e) {}
  var btns = document.querySelectorAll('.invbtn');
  for (var i = 0; i < btns.length; i++) {
    (function (b) {
      b.addEventListener('click', function () {
        INVERT = (b.getAttribute('data-inv') === '1');
        persistInvert();
        syncInv();
      });
    })(btns[i]);
  }
  if (!UNLOCKED) INVERT = true;   // 未解锁时固定逆反（本版特色）
  syncInv();
  applyUnlockUi();
})();

// ── 定时开放：2026-11-11 00:00 前锁住（测试入口：网址后面加 =b）──
  var OPEN_AT = new Date(2026, 10, 11, 0, 0, 0).getTime();   // 月份 10 = 11月
  var BETA_UNLOCK = /=b$/.test((location.hash || '').replace(/^#/, '')) || /[#&]beta/.test(location.hash || '');
  function updateD3Lock() {
    var lock = document.getElementById('d3lock');
    var btn = document.getElementById('startBtn');
    var tag = document.getElementById('d3tag');
    if (!lock || !btn) return;
    if (Date.now() >= OPEN_AT) {
      // 正式版（含改时间彩蛋：日期调到 11.11 后即解锁）
      lock.style.display = 'none';
      if (tag) tag.textContent = 'WEBGL · 正式版 🎉';
      return;
    }
    if (BETA_UNLOCK) {
      lock.style.display = 'none';
      if (tag) tag.textContent = 'WEBGL · 正式版 🎉';
      return;
    }
    lock.style.display = 'flex';   // 只显示预告条，开始按钮保留
    // 11.11 倒计时：用 rAF 驱动（跟游戏同帧，不漂移）
    (function tickD3() {
      var ms = OPEN_AT - Date.now();
      if (ms <= 0) { updateD3Lock(); return; }
      var d = Math.floor(ms / 86400000);
      var hh = Math.floor(ms % 86400000 / 3600000);
      var mm = Math.floor(ms % 3600000 / 60000);
      var ss = Math.floor(ms % 60000 / 1000);
      var cd = document.getElementById('d3cd');
      if (cd) cd.textContent = d + '天 ' + (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
      requestAnimationFrame(tickD3);
    })();
  }

  document.getElementById("startBtn").addEventListener("click", startRace);
window.addEventListener("resize", function () { W = window.innerWidth; H = window.innerHeight; camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H); });
updateHud();
var whoInit = document.getElementById('who3d');
if (whoInit) whoInit.textContent = getLastName3d();
updateD3Lock();
requestAnimationFrame(frame);
})();
</script>
